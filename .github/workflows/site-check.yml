name: Site quality checks

on:
  push:
    branches: ["main", "lab-2-1/**", "contrib/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Static site and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate checked-in pages and local links
        run: python scripts/check_site.py .

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check src/app_src.js
          node --check assets/theme-init.js
          node --check src/theme_init.js

      - name: Rebuild generated site
        run: |
          python src/build.py /tmp/gyaanify-build
          cp favicon.svg /tmp/gyaanify-build/favicon.svg
          python scripts/check_site.py /tmp/gyaanify-build

      - name: Verify source and generated assets match
        run: |
          cmp src/style.css assets/style.css
          cmp src/theme_init.js assets/theme-init.js
          python -c 'from pathlib import Path; built = Path("assets/app.js").read_text(encoding="utf-8").split("\n", 1)[1]; source = Path("src/app_src.js").read_text(encoding="utf-8"); assert built == source, "assets/app.js is out of sync with src/app_src.js"'
